name: PmVault Linux build gate

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build pkg-config \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev \
            libbotan-2-dev libargon2-dev libminizip-dev libqrencode-dev zlib1g-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKEEPASSXC_BUILD_TYPE=Release \
            -DWITH_TESTS=OFF \
            -DWITH_GUI_TESTS=OFF \
            -DWITH_XC_DOCS=OFF \
            -DWITH_XC_BROWSER=ON \
            -DWITH_XC_NETWORKING=OFF \
            -DWITH_XC_SSHAGENT=OFF \
            -DWITH_XC_KEESHARE=OFF \
            -DWITH_XC_YUBIKEY=OFF \
            -DWITH_XC_UPDATECHECK=OFF \
            -DWITH_XC_FDOSECRETS=OFF \
            -DWITH_XC_X11=OFF

      - name: Build
        shell: bash
        run: |
          set +e
          cmake --build build -j 2 2>&1 | tee /tmp/pmvault-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Compiler/linker diagnostics"
            grep -E "error:|fatal error:|undefined reference|No such file or directory|ninja: build stopped|collect2:" /tmp/pmvault-build.log | head -n 100 || true
            echo "::endgroup::"
            grep -E "error:|fatal error:|undefined reference|No such file or directory" /tmp/pmvault-build.log | head -n 40 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | tr '\r\n' '  ' | cut -c1-900)
              printf '::error::%s\n' "$msg"
            done
            exit "$status"
          fi

      - name: Smoke test
        run: ./build/src/cli/keepassxc-cli --version
