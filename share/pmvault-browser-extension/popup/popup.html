<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PmVault</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="logo">P</div>
      <div class="title">PmVault</div>
      <div id="status" class="status status-warn">未连接</div>
    </header>

    <div class="searchrow">
      <input id="q" type="text" placeholder="输入网站地址搜索，如 example.com" autocomplete="off" />
      <button id="searchBtn" class="primary">搜索</button>
    </div>
    <div class="hint" id="urlHint"></div>

    <div id="results" class="results"></div>

    <footer>
      <button id="associateBtn" class="ghost">连接/关联桌面端</button>
      <button id="optionsBtn" class="ghost">设置</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
